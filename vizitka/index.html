<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vizitka</title>
    <style>
        body {
            background-color: lightblue;
            margin: 0;
            padding: 0;
            font-family: 'Times New Roman', Times;
        }
        h1 {
            margin-top: 0;
            color: blue;
        }
        p{
            color: blue;
        }
        h3{
            color: blue;
        }
        ol{color: blue;}
        .wrapper {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .vizitka {
            background-color: white;
            width: 300px;
            border-radius: 16px;
            padding: 20px;
        }
        .profile-img {
            width: 80px; 
            height: auto;
            vertical-align: middle;
            border-radius: 5px;
            display: block;
            margin-bottom: 10px;
        }
        .ovladani {
            margin-bottom: 15px;
            font-size: 14px;
        }
        button {
            padding: 15px 30px;
            color: white;
            border-radius: 5px;
            border: 0;
            background: linear-gradient(45deg, blue, lightblue);
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="vizitka">
            <h1>Benjamin Netanjahu</h1>
            
            <img id="obrazek" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQJHU-uliBcdD9qB2qswL5qUCN_1xRTDOhTJO9ilFhZPQ&s=10" class="profile-img" alt="Benjamin Netanjahu">
            

            <p>Benjamin Netanjahu (nar. 1949) je dlouholetý předseda strany Likud a nejdéle sloužící premiér v historii Izraele. V mládí sloužil v elitní armádní jednotce Sajeret Matkal a vystudoval v USA na MIT.</p>
            
            <h3>Co má rád</h3>
            <ol>
                <li>Knihy o historii.</li>

            </ol>

        </div>
